                    🌟 [考古題]福和111-1 七上一段 生物 (練功區) 🌟
                </h1>
                <span className="text-3xl">✨</span>
            </div>
        </header>
    );

    const QuestionCard = ({ item, index, selectedIdx, onSelect, isReviewMode }) => {
        const showResult = selectedIdx !== undefined && selectedIdx !== null;
        const handleSelect = (idx) => { if (!showResult) onSelect(item.id, idx, idx === item.ans); };
        const createMarkup = (htmlStr) => ({ __html: htmlStr });
        return (
            <div className="mb-10 w-full max-w-3xl mx-auto fade-in">
                <div className="bg-white rounded-3xl shadow-[0_4px_20px_rgb(0,0,0,0.05)] overflow-hidden border border-gray-100">
                    <div className={`p-5 border-b border-gray-50 flex gap-3 ${isReviewMode ? 'bg-gradient-to-r from-rose-100 to-red-100' : 'bg-gradient-to-r from-blue-100 to-teal-100'}`}>
                        <div className={`flex-shrink-0 w-10 h-10 bg-white rounded-full flex items-center justify-center font-black shadow-sm text-lg ${isReviewMode ? 'text-rose-600' : 'text-teal-600'}`}>
                            {item.id}
                        </div>
                        <div className="text-lg font-bold text-gray-800 self-center leading-relaxed" dangerouslySetInnerHTML={createMarkup(item.q)} />
                    </div>
                    
                    {item.img && (
                        <div className="p-4 bg-gray-50 flex justify-center border-b border-gray-100">
                            <img src={item.img} alt={`第${item.id}題圖片`} className="max-w-full h-auto max-h-64 object-contain img-shadow rounded-lg border-2 border-white" />
                        </div>
                    )}
                    <div className="p-5 space-y-3">
                        {item.opts.map((opt, idx) => {
                            const isSelected = selectedIdx === idx;
                            const isCorrect = idx === item.ans;
                            let btnClass = "w-full text-left p-4 rounded-2xl border-2 transition-all duration-300 ease-out relative flex items-center gap-4 group ";
                            let icon = null;
                            if (!showResult) {
                                btnClass += isReviewMode ? "border-rose-50 bg-white hover:border-rose-300 hover:bg-rose-50 bouncy text-gray-700 cursor-pointer shadow-sm" : "border-blue-50 bg-white hover:border-teal-300 hover:bg-teal-50 bouncy text-gray-700 cursor-pointer shadow-sm";
                                icon = <div className={`w-6 h-6 rounded-full border-2 ${isReviewMode ? 'border-gray-300 group-hover:border-rose-400' : 'border-gray-300 group-hover:border-teal-400'}`}></div>;
                            } else {
                                btnClass += " cursor-default ";
                                if (isCorrect) {
                                    btnClass += "border-green-400 bg-green-50 text-green-800 shadow-md transform scale-[1.01]";
                                    icon = <div className="flex-shrink-0 w-7 h-7 rounded-full bg-green-500 text-white flex items-center justify-center shadow-sm"><i className="fas fa-check"></i></div>;
                                } else if (isSelected && !isCorrect) {
                                    btnClass += "border-red-300 bg-red-50 text-red-700 opacity-90";
                                    icon = <div className="flex-shrink-0 w-7 h-7 rounded-full bg-red-400 text-white flex items-center justify-center shadow-sm"><i className="fas fa-times"></i></div>;
                                } else {
                                    btnClass += "border-gray-100 bg-gray-50 text-gray-400";
                                    icon = <div className="w-6 h-6 rounded-full border-2 border-gray-200"></div>;
                                }
                            }
                            return (
                                <button key={idx} onClick={() => handleSelect(idx)} className={btnClass} disabled={showResult}>
                                    {icon}
                                    <span className="text-base md:text-lg" dangerouslySetInnerHTML={createMarkup(opt)} />
                                </button>
                            );
                        })}
                    </div>
                    {showResult && (
                        <div className="m-5 mt-0 bg-yellow-50 border-2 border-yellow-300 rounded-2xl p-6 relative fade-in">
                            <div className="absolute -top-4 left-6 bg-gradient-to-r from-yellow-400 to-yellow-500 text-white px-5 py-1.5 rounded-full font-bold shadow-md flex items-center gap-2 tracking-wider">
                                <i className="fas fa-lightbulb"></i> ✨ 觀念大補帖
                            </div>
                            <div className="mt-3 text-gray-800 leading-relaxed text-base md:text-lg">
                                {selectedIdx === item.ans ? 
                                    <div className="mb-3 font-bold text-green-600 flex items-center gap-2">
                                        <i className="fas fa-star"></i> {isReviewMode ? "太棒了！你成功克服這題了 🎉" : "太棒了！答對囉 🎉"}
                                    </div> : 
                                    <div className="mb-3 font-bold text-red-500 flex items-center gap-2">
                                        <i className="fas fa-question-circle"></i> 哎呀，再想想看！來看看哪裡卡住了 🤔
                                    </div>
                                }
                                <div className="space-y-2 border-t border-yellow-200 pt-3" dangerouslySetInnerHTML={createMarkup(item.exp)} />
                            </div>
                        </div>
                    )}
                </div>
            </div>
        );
    };

    const App = () => {
        const [activeTab, setActiveTab] = useState('part1');
        const [reviewAnswers, setReviewAnswers] = useState({});
        const [answers, setAnswers] = useState(() => safeGetItem('magic_exam_progress_answers_111171bio', {}));
        const [wrongIds, setWrongIds] = useState(() => safeGetItem('magic_exam_progress_wrongIds_111171bio', []));
        const [records, setRecords] = useState(() => safeGetItem('magic_exam_records_111171bio', []));
        const [toastMessage, setToastMessage] = useState(null);
        const [showResetModal, setShowResetModal] = useState(false);
        const [resetStep, setResetStep] = useState(0);

        useEffect(() => {
            safeSetItem('magic_exam_progress_answers_111171bio', answers);
            safeSetItem('magic_exam_progress_wrongIds_111171bio', wrongIds);
        }, [answers, wrongIds]);

        useEffect(() => { safeSetItem('magic_exam_records_111171bio', records); }, [records]);
        useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [activeTab]);

        const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(null), 3000); };

        const handleSelect = (qId, idx, isCorrect) => {
            if (activeTab === 'review') { setReviewAnswers(prev => ({ ...prev, [qId]: idx })); } 
            else {
                setAnswers(prev => ({ ...prev, [qId]: idx }));
                if (!isCorrect) setWrongIds(prev => prev.includes(qId) ? prev : [...prev, qId]);
            }
        };

        const handleSaveRecord = () => {
            const answeredCount = Object.keys(answers).length;
            if (answeredCount === 0) return showToast("目前還沒有作答紀錄可以存檔喔！");
            const newRecord = {
                id: Date.now(), timestamp: new Date().toLocaleString('zh-TW'),
                attempt: records.length + 1, totalAnswered: answeredCount,
                correctCount: answeredCount - wrongIds.length, wrongCount: wrongIds.length,
                wrongIds: [...wrongIds]
            };
            setRecords([...records, newRecord]);
            showToast(`✅ 已存檔！第 ${newRecord.attempt} 次作答紀錄保存成功。`);
        };

        const handleExport = (type) => {
            if (wrongIds.length === 0) return showToast("🎉 太棒了！目前沒有錯題，不需要匯出！");
            const wrongQs = questions.filter(q => wrongIds.includes(q.id));
            const baseURI = window.location.href.split('?')[0].split('#')[0].replace(/\/[^\/]*$/, '/');
            let htmlContent = `<!DOCTYPE html><html lang="zh-TW"><head><meta charset="UTF-8"><title>錯題匯出</title><base href="${baseURI}"><style>body{font-family:'Noto Sans TC',sans-serif;line-height:1.6;padding:20px;color:#333;max-width:800px;margin:0 auto;}h1{text-align:center;color:#0d9488;}.meta-info{text-align:center;color:#666;margin-bottom:30px;}.question-card{border:2px solid #e5e7eb;padding:20px;margin-bottom:25px;border-radius:12px;page-break-inside:avoid;}.q-title{font-weight:bold;font-size:1.3em;color:#0f766e;margin-bottom:15px;border-bottom:1px solid #e5e7eb;padding-bottom:10px;}.q-img{max-width:100%;max-height:250px;display:block;margin:15px auto;border:1px solid #ccc;}.options{margin-bottom:20px;}.option{padding:8px 12px;margin-bottom:5px;border-radius:6px;background-color:#f9fafb;}.correct{color:#16a34a;font-weight:bold;background-color:#f0fdf4;border:1px solid #bbf7d0;}.explanation{background:#fffbeb;padding:15px;border-radius:8px;border-left:5px solid #f59e0b;}.exp-title{font-weight:bold;color:#d97706;margin-bottom:8px;}@media print{body{padding:0;}.question-card{border:1px solid #999;page-break-inside:avoid;box-shadow:none;}}</style></head><body><h1>🌟 錯題本 🌟</h1><div class="meta-info">匯出時間：${new Date().toLocaleString('zh-TW')} | 總錯題數：${wrongQs.length} 題</div>`;
            wrongQs.forEach(q => {
                htmlContent += `<div class="question-card"><div class="q-title">第 ${q.id} 題</div><div>${q.q}</div>${q.img ? `<img class="q-img" src="${q.img}" />` : ''}<div class="options">${q.opts.map((opt, idx) => `<div class="option ${idx === q.ans ? 'correct' : ''}">${idx === q.ans ? '✅ ' : '⬜ '}${opt}</div>`).join('')}</div><div class="explanation"><div class="exp-title">✨ 觀念大補帖：</div><div>${q.exp}</div></div></div>`;
            });
            htmlContent += `</body></html>`;
            if (type === 'html') {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(new Blob([htmlContent], { type: 'text/html' }));
                a.download = `錯題本_${new Date().getTime()}.html`;
                a.click(); showToast("⬇️ HTML 檔案已下載！");
            } else if (type === 'pdf') {
                const printWindow = window.open('', '_blank');
                if (printWindow) { printWindow.document.write(htmlContent); printWindow.document.close(); printWindow.onload = () => { printWindow.focus(); printWindow.print(); }; } 
                else showToast("❌ 無法開啟列印視窗，請允許瀏覽器彈出視窗！");
            }
        };

        const executeReset = () => {
            if (resetStep === 1) {
                setAnswers({}); setWrongIds([]); setReviewAnswers({});
                safeRemoveItem('magic_exam_progress_answers_111171bio'); safeRemoveItem('magic_exam_progress_wrongIds_111171bio');
                showToast("🗑️ 已刪除此次作答紀錄！");
            } else if (resetStep === 2) {
                setAnswers({}); setWrongIds([]); setReviewAnswers({}); setRecords([]);
                safeClear(); showToast("💥 已清空本機所有作答與存檔紀錄！");
            }
            setShowResetModal(false); setResetStep(0);
        };

        let currentQuestions = [];
        if (activeTab === 'part1') currentQuestions = questions.filter(q => q.part === 1);
        else if (activeTab === 'part2') currentQuestions = questions.filter(q => q.part === 2);
        else if (activeTab === 'review') currentQuestions = questions.filter(q => wrongIds.includes(q.id));

        return (
            <div className="min-h-screen pb-20 relative">
                <Header />
                {toastMessage && (
                    <div className="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 toast-enter">
                        <div className="bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl font-bold flex items-center gap-3">{toastMessage}</div>
                    </div>
                )}
                {showResetModal && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4 fade-in">
                        <div className="bg-white rounded-3xl p-6 md:p-8 max-w-sm w-full shadow-2xl">
                            {resetStep === 0 ? (
                                <>
                                    <h3 className="text-2xl font-bold text-gray-800 mb-2 flex items-center gap-2"><i className="fas fa-triangle-exclamation text-rose-500"></i> 砍掉重練</h3>
                                    <div className="space-y-3 mt-4">
                                        <button onClick={() => setResetStep(1)} className="w-full text-left px-5 py-4 rounded-xl bg-orange-50 text-orange-700 font-bold border border-orange-200 shadow-sm bouncy">① 僅刪除此次作答紀錄</button>
                                        <button onClick={() => setResetStep(2)} className="w-full text-left px-5 py-4 rounded-xl bg-rose-50 text-rose-700 font-bold border border-rose-200 shadow-sm bouncy">② 刪除本機所有紀錄</button>
                                        <button onClick={() => {setShowResetModal(false); setResetStep(0);}} className="w-full text-left px-5 py-4 rounded-xl bg-gray-50 text-gray-700 font-bold border border-gray-200 shadow-sm bouncy">③ 算了，不要刪了</button>
                                    </div>
                                </>
                            ) : (
                                <>
                                    <h3 className="text-2xl font-bold text-rose-600 mb-4"><i className="fas fa-circle-question mr-2"></i>再次確認</h3>
                                    <p className="text-gray-700 mb-8 font-medium leading-relaxed">{resetStep === 1 ? "確定要刪除「此次作答紀錄」嗎？" : "確定要刪除「本機所有紀錄」嗎？(無法復原)"}</p>
                                    <div className="flex gap-3">
                                        <button onClick={() => {setShowResetModal(false); setResetStep(0);}} className="flex-1 py-3 rounded-xl bg-gray-100 text-gray-700 font-bold bouncy">取消</button>
                                        <button onClick={executeReset} className="flex-1 py-3 rounded-xl bg-rose-500 text-white font-bold shadow-md bouncy">確定刪除</button>
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                )}
                
                <div className="max-w-3xl mx-auto px-4 mb-6 flex flex-wrap gap-2 md:gap-3 justify-center">
                    <button onClick={handleSaveRecord} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-indigo-50 text-indigo-700 border-2 border-indigo-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-save"></i> 紀錄存檔</button>
                    <button onClick={() => handleExport('html')} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-blue-50 text-blue-700 border-2 border-blue-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-download"></i> 匯出 (HTML)</button>
                    <button onClick={() => handleExport('pdf')} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-emerald-50 text-emerald-700 border-2 border-emerald-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-print"></i> 列印 / PDF</button>
                    <button onClick={() => {setShowResetModal(true); setResetStep(0);}} className="flex-1 min-w-[140px] py-2.5 px-4 rounded-xl font-bold bg-rose-50 text-rose-700 border-2 border-rose-200 bouncy flex items-center justify-center gap-2"><i className="fas fa-trash-can"></i> 砍掉重練</button>
                </div>
                <div className="max-w-3xl mx-auto px-4 mb-8 flex flex-wrap gap-3">
                    <button onClick={() => setActiveTab('part1')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm ${activeTab === 'part1' ? 'bg-teal-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>第一部份 (1~25題)</button>
                    <button onClick={() => setActiveTab('part2')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm ${activeTab === 'part2' ? 'bg-teal-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>第二部份 (26~50題)</button>
                    <button onClick={() => setActiveTab('review')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm relative ${activeTab === 'review' ? 'bg-rose-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>
                        錯題複習
                        {Array.isArray(wrongIds) && wrongIds.length > 0 && (<span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-black px-2 py-1 rounded-full animate-bounce">{wrongIds.length}</span>)}
                    </button>
                    <button onClick={() => setActiveTab('history')} className={`flex-1 min-w-[100px] py-3 px-2 rounded-2xl font-bold shadow-sm ${activeTab === 'history' ? 'bg-indigo-500 text-white transform -translate-y-1' : 'bg-white text-gray-500'}`}>歷史紀錄</button>
                </div>
                {activeTab === 'history' ? (
                    <div className="px-4 max-w-3xl mx-auto fade-in">
                        <h2 className="text-xl font-bold text-indigo-700 mb-6"><i className="fas fa-clock-rotate-left mr-2"></i>我的存檔紀錄</h2>
                        {records.length === 0 ? (
                            <div className="text-center py-16 bg-white rounded-3xl shadow-sm border"><p className="text-gray-500 font-medium">目前沒有存檔紀錄喔！</p></div>
                        ) : (
                            <div className="space-y-4">
                                {[...records].reverse().map(record => (
                                    <div key={record.id} className="bg-white p-5 rounded-2xl shadow-sm border border-l-4 border-l-indigo-500">
                                        <div className="text-xs text-gray-400 font-bold mb-1">{record.timestamp}</div>
                                        <div className="font-extrabold text-lg text-gray-800 mb-1">第 {record.attempt} 次挑戰紀錄</div>
                                        <div className="text-sm font-medium text-gray-600">作答：{record.totalAnswered} 題 | <span className="text-green-600">答對：{record.correctCount} 題</span> | <span className="text-rose-500">答錯：{record.wrongCount} 題</span></div>
                                        {record.wrongIds && record.wrongIds.length > 0 && (<div className="mt-2 bg-rose-50 text-rose-700 px-4 py-2 rounded-xl text-sm font-bold">錯題：{record.wrongIds.join(', ')}</div>)}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                ) : activeTab === 'review' && wrongIds.length === 0 ? (
                    <div className="text-center py-20 bg-white rounded-3xl shadow-sm max-w-3xl mx-auto fade-in"><div className="text-6xl mb-4">🌟</div><h2 className="text-2xl font-bold text-teal-600">太棒了！目前沒有錯題！</h2></div>
                ) : (
                    <div className="px-4">
                        {activeTab === 'review' && (
                            <div className="max-w-3xl mx-auto mb-6 flex justify-between items-center fade-in"><h2 className="text-xl font-bold text-rose-600"><i className="fas fa-fire mr-2"></i>錯題特訓區</h2><button onClick={() => setReviewAnswers({})} className="px-4 py-2 bg-rose-100 text-rose-700 rounded-full font-bold text-sm shadow-sm bouncy"><i className="fas fa-redo mr-1"></i> 重新測驗</button></div>
                        )}
                        {currentQuestions.map((q, idx) => (<QuestionCard key={`${activeTab}-${q.id}`} item={q} index={idx} selectedIdx={activeTab === 'review' ? reviewAnswers[q.id] : answers[q.id]} onSelect={handleSelect} isReviewMode={activeTab === 'review'} />))}
                    </div>
                )}
            </div>
        );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
